# Netlify builds the Next.js app in frontend/. Its Next.js runtime is applied
# automatically and serves pages plus the /api/v1 route handlers as functions.
#
# Set these in Site configuration → Environment variables (server-side only):
#   SUPABASE_URL, SUPABASE_SECRET_KEY,
#   BACKEND_URL   the Spring gateway, e.g. https://nutrination-gateway.onrender.com
#   AUTH_SECRET   must equal JWT_SECRET on the customer-service (Render)

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Declared explicitly: auto-detection runs at the repo root (no Next.js there)
# and skipped it, which uploaded .next as static files and 404'd every route.
[[plugins]]
  package = "@netlify/plugin-nextjs"
