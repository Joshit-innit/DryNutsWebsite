# Netlify builds the Next.js app in frontend/. Its Next.js runtime is applied
# automatically and serves pages plus the /api/v1 route handlers as functions.
#
# Set these in Site configuration → Environment variables (server-side only):
#   SUPABASE_URL, SUPABASE_SECRET_KEY,
#   BACKEND_URL   the Spring gateway, e.g. https://nutrination-gateway.onrender.com
#   AUTH_SECRET   must equal JWT_SECRET on the customer-service (Render)

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # The site no longer reads ADMIN_EMAIL, but the variable is still set on Netlify
  # and its value is the public support address printed on the contact and policy
  # pages, which the secret scanner would otherwise flag.
  # Google sign-in's web client id (Google Cloud project "NutriNation"). Public by
  # design: it is sent to every visitor's browser. Must match GOOGLE_CLIENT_ID on Render.
  NEXT_PUBLIC_GOOGLE_CLIENT_ID = "471875580309-tusnlkshtq86mui2hf24gsiaiolhq3pd.apps.googleusercontent.com"
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAIL,NEXT_PUBLIC_GOOGLE_CLIENT_ID"

# Declared explicitly: auto-detection runs at the repo root (no Next.js there)
# and skipped it, which uploaded .next as static files and 404'd every route.
[[plugins]]
  package = "@netlify/plugin-nextjs"
