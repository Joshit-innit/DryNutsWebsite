server:
  # Render (and most PaaS hosts) inject PORT.
  port: ${PORT:8082}

spring:
  application:
    name: customer-service
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/nutrination_customers}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      # Keep low on Supabase: the session pooler caps connections per project.
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # "public" locally (one database per service). On Supabase all services share one
        # database, so each gets its own schema: set CUSTOMER_DB_SCHEMA=customer_service.
        default_schema: ${CUSTOMER_DB_SCHEMA:public}
        hbm2ddl:
          create_namespaces: true
    open-in-view: false

eureka:
  client:
    # Set EUREKA_ENABLED=false where services reach each other by URL (e.g. Render).
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

frontend:
  # Comma-separated list, e.g. https://your-site.netlify.app
  allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

seed:
  admin:
    email: ${ADMIN_EMAIL:admin@nutrination.in}
    password: ${ADMIN_PASSWORD:NutriAdmin@2026}

security:
  jwt:
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:PT15M}

management:
  endpoints:
    web:
      exposure:
        include: health,info
