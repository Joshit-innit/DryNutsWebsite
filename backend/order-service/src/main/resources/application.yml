server:
  # Render (and most PaaS hosts) inject PORT.
  port: ${PORT:8083}

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/nutrination_orders}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      # Keep low on Supabase: the session pooler caps connections per project.
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # "public" locally (one database per service). On Supabase all services share one
        # database, so each gets its own schema: set ORDER_DB_SCHEMA=order_service.
        default_schema: ${ORDER_DB_SCHEMA:public}
        hbm2ddl:
          create_namespaces: true
    open-in-view: false

# Used when Eureka is off; takes a comma-separated list. Blank means "ask Eureka".
nutrination:
  services:
    product-service: ${PRODUCT_SERVICE_URL:}
    customer-service: ${CUSTOMER_SERVICE_URL:}

# Feign's default read timeout is a minute, which would hold a checkout open.
spring.cloud.openfeign.client.config.default:
  connect-timeout: 5000
  read-timeout: ${FEIGN_READ_TIMEOUT:10000}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${CIRCUIT_OPEN_DURATION:20s}
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # A 4xx means the service answered; the caller's request was the problem.
        ignore-exceptions:
          - feign.FeignException$BadRequest
          - feign.FeignException$Unauthorized
          - feign.FeignException$Forbidden
          - feign.FeignException$NotFound
    instances:
      productClient:
        base-config: default
      customerClient:
        base-config: default

eureka:
  client:
    # Set EUREKA_ENABLED=false where services reach each other by URL (e.g. Render).
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

springdoc:
  # Off unless asked for: a public map of every endpoint only helps attackers.
  # Set API_DOCS_ENABLED=true locally to browse Swagger UI.
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html

frontend:
  # Comma-separated list, e.g. https://your-site.netlify.app
  allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
