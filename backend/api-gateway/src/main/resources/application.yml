server:
  # Render (and most PaaS hosts) inject PORT.
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Services also emit CORS headers; browsers reject duplicated Allow-Origin values.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Expose-Headers Vary, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            # Comma-separated list, e.g. https://your-site.netlify.app
            allowedOrigins: "${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      # Each URI defaults to Eureka (lb://). Without Eureka, set the *_SERVICE_URL
      # variables to the services' base URLs, e.g. https://nutrination-product.onrender.com
      routes:
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:lb://product-service}
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:lb://customer-service}
          predicates:
            - Path=/api/v1/customers/**,/api/v1/auth/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:lb://order-service}
          predicates:
            - Path=/api/v1/orders/**
        - id: product-openapi
          uri: ${PRODUCT_SERVICE_URL:lb://product-service}
          predicates:
            - Path=/product-service/v3/api-docs
          filters:
            - RewritePath=/product-service/v3/api-docs, /v3/api-docs
        - id: customer-openapi
          uri: ${CUSTOMER_SERVICE_URL:lb://customer-service}
          predicates:
            - Path=/customer-service/v3/api-docs
          filters:
            - RewritePath=/customer-service/v3/api-docs, /v3/api-docs
        - id: order-openapi
          uri: ${ORDER_SERVICE_URL:lb://order-service}
          predicates:
            - Path=/order-service/v3/api-docs
          filters:
            - RewritePath=/order-service/v3/api-docs, /v3/api-docs

eureka:
  client:
    # Set EUREKA_ENABLED=false where services reach each other by URL (e.g. Render).
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

springdoc:
  swagger-ui:
    urls:
      - name: Product Service
        url: /product-service/v3/api-docs
      - name: Customer Service
        url: /customer-service/v3/api-docs
      - name: Order Service
        url: /order-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
